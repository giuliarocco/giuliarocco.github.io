    - title: Visiting Researcher
      institution: Concordia University, Montreal, Canada
      year: 2022
      description:
        - Led data collection and management for multimodal neuroimaging projects involving 30 participants and 300+ recordings.
        - Pioneered a computational framework for cerebellar fNIRS image reconstruction, effectively solving forward and inverse problems.

    - title: Teaching Assistant
      institution: Université Côte d'Azur, Nice, France
      year: 2020
      description:
        - Taught Algorithms & Programming with R to 30+ students, delivering practical sessions and project-based assignments.

    - title: Research Intern
      institution: Politecnico di Milano, Milan, Italy
      year: 2019
      description:
        - Analyzed biomedical signals (EEG, ECG, PPG, EDA, eye tracking) for emotion and stress detection, developing novel indices for biomedical and biomarketing applications.
        - Contributed to multidisciplinary VR therapy research for neurodevelopmental disorders, managing physiological monitoring and data analysis to drive insights.
        - Conducted a comparative analysis of two popular wearable devices and a clinical-grade ECG, revealing significant variations in inter-beat-interval accuracy.
    
