        - Led cross-institutional project management, coordinating 50+ subject recruitment, 20K $ budget oversight, and data integrity, while also successfully obtaining two equipment loans from industry to facilitate experiments.

    - title: PhD Intern
      workplace: NIRx Medical Technologies, Berlin, Germany
