        - Combining MRI and optical imaging to map microvascular function and oxygen metabolism in healthy and diseased brain.

    - title: Graduate Research Assistant
      institution: I3S Laboratory and University Hospital of Nice, France
      year: 2020 - 2023
      description:
        - Conducted multimodal data collection and analysis (fMRI, fNIRS, EEG) to investigate cerebellar activation, resulting in 6 published findings.
